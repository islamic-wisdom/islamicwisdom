name: Update latest YouTube videos

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: latest-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest videos from YouTube
        run: node .github/scripts/fetch-latest-videos.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/latest-videos.json; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/latest-videos.json
          git commit -m "Update latest YouTube videos"
          git push
